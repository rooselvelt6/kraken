[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "2"
default-members = [
  "crates/api",
  "crates/commands",
  "crates/kraken-config",
  "crates/kraken-conversation",
  "crates/kraken-errors",
  "crates/kraken-events",
  "crates/kraken-git",
  "crates/kraken-infra",
  "crates/kraken-mcp",
  "crates/kraken-policy",
  "crates/kraken-session",
  "crates/localmodels",
  "crates/plugins",
  "crates/rusty-claude-cli",
  "crates/security",
  "crates/telemetry",
  "crates/tools",
  "crates/vulnscan",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = "1"
serde_json = "1"
rand = "0.10"
thiserror = "2"

[profile.release]
lto = "fat"
strip = "symbols"
panic = "abort"
codegen-units = 1
opt-level = "z"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[package]
name = "sniffer"
version.workspace = true
edition = "2021"
authors = ["Kraken Contributors"]

[dependencies]
pcap = { version = "2.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand.workspace = true
hex = "0.4"
base64 = "0.22"
kraken-errors = { path = "../kraken-errors" }

[features]
default = []
# Requiere libpcap headers en el sistema. Ver https://docs.rs/pcap
pcap = ["dep:pcap"]
